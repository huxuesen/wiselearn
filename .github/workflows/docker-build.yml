name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/wiselearn

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 模拟器（支持 arm64 构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 生成时间戳标签（北京时间）
        id: timestamp
        run: |
          echo "ts=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.timestamp.outputs.ts }}
            type=semver,pattern={{version}}
          flavor: |
            latest=false

      - name: 构建并推送 Docker 镜像（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 清理 GHCR 无标签版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有版本，筛选无标签的，逐个删除
          gh api "/user/packages/container/wiselearn/versions" --paginate \
            --jq '.[] | select(.metadata.container.tags == []) | .id' \
            > /tmp/untagged_versions.txt 2>/dev/null || echo "没有无标签版本" > /tmp/untagged_versions.txt

          count=$(wc -l < /tmp/untagged_versions.txt)
          echo "找到 $count 个无标签版本"

          while IFS= read -r vid; do
            [ -z "$vid" ] && continue
            echo "删除: $vid"
            gh api --method DELETE "/user/packages/container/wiselearn/versions/$vid" \
              --silent 2>/dev/null || true
          done < /tmp/untagged_versions.txt

          echo "清理完成"
